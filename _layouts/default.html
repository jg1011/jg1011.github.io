<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    
    <!-- MathJax 3 -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <!-- SEO -->
    {% seo %}
</head>
<body>
    <header class="site-header">
        <nav class="nav">
            <a href="{{ '/' | relative_url }}" class="nav-brand">{{ site.author.name }}</a>
            <div class="nav-links">
                <a href="#about">About</a>
                <a href="#projects">Projects</a>
                <a href="#libraries">Libraries</a>
                <a href="#articles">Articles</a>
            </div>
        </nav>
    </header>

    <main class="main-content">
        {{ content }}
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author.name }}</p>
            <div class="footer-links">
                <a href="mailto:{{ site.author.email }}">Email</a>
                <a href="https://github.com/{{ site.author.github }}" target="_blank">GitHub</a>
                <a href="{{ site.author.linkedin }}" target="_blank">LinkedIn</a>
            </div>
        </div>
    </footer>
</body>
</html>
